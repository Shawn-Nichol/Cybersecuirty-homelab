<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="Arial, Helvetica, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="780" height="440" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#111">Lab network design (Phase 02)</text>
<rect x="20" y="70" width="170" height="130" rx="8" fill="#f1f3f5" stroke="#555"/>
<text x="105" y="95" text-anchor="middle" font-weight="bold" fill="#111">Home LAN (WAN side)</text>
<text x="105" y="120" text-anchor="middle" fill="#333">Home router</text>
<text x="105" y="140" text-anchor="middle" fill="#333">Admin workstation</text>
<text x="105" y="160" text-anchor="middle" fill="#333">Proxmox host</text>
<text x="105" y="185" text-anchor="middle" fill="#555" font-size="11">via vmbr0</text>
<line x1="190" y1="135" x2="300" y2="215" stroke="#333" stroke-width="2"/>
<rect x="300" y="160" width="160" height="110" rx="8" fill="#fff4e0" stroke="#b36b00" stroke-width="2"/>
<text x="380" y="190" text-anchor="middle" font-weight="bold" fill="#111">OPNsense (VM 100)</text>
<text x="380" y="212" text-anchor="middle" fill="#333">vtnet0 = WAN</text>
<text x="380" y="232" text-anchor="middle" fill="#333">vtnet1-4 = lab zones</text>
<text x="380" y="254" text-anchor="middle" fill="#555" font-size="11">no physical port on lab bridges</text>
<g stroke="#333" stroke-width="2">
<line x1="460" y1="190" x2="540" y2="80"/>
<line x1="460" y1="205" x2="540" y2="165" stroke-dasharray="6 4"/>
<line x1="460" y1="225" x2="540" y2="265" stroke-dasharray="6 4"/>
<line x1="460" y1="240" x2="540" y2="350" stroke-dasharray="6 4"/>
</g>
<rect x="540" y="50" width="220" height="60" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
<text x="650" y="75" text-anchor="middle" font-weight="bold" fill="#111">MGMT  vmbr1  10.10.10.0/24</text>
<text x="650" y="95" text-anchor="middle" fill="#333">vtnet1 - configured</text>
<rect x="540" y="135" width="220" height="60" rx="8" fill="#fff" stroke="#888" stroke-dasharray="6 4"/>
<text x="650" y="160" text-anchor="middle" font-weight="bold" fill="#111">ATTACKER  vmbr2  10.10.20.0/24</text>
<text x="650" y="180" text-anchor="middle" fill="#555">vtnet2 - planned</text>
<rect x="540" y="235" width="220" height="60" rx="8" fill="#fff" stroke="#888" stroke-dasharray="6 4"/>
<text x="650" y="260" text-anchor="middle" font-weight="bold" fill="#111">VICTIM  vmbr3  10.10.30.0/24</text>
<text x="650" y="280" text-anchor="middle" fill="#555">vtnet3 - planned</text>
<rect x="540" y="320" width="220" height="60" rx="8" fill="#fff" stroke="#888" stroke-dasharray="6 4"/>
<text x="650" y="345" text-anchor="middle" font-weight="bold" fill="#111">SIEM  vmbr4  10.10.40.0/24</text>
<text x="650" y="365" text-anchor="middle" fill="#555">vtnet4 - planned</text>
<text x="20" y="420" fill="#555" font-size="12">Solid = built and verified. Dashed = bridge exists, interface and rules pending.</text>
